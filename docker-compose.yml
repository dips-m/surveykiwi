version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveykiwi_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    depends_on:
      - db
    networks:
      - surveykiwi

  db:
    image: mariadb:10.5
    container_name: surveykiwi_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: surveykiwi
      MYSQL_USER: surveykiwi
      MYSQL_PASSWORD: survey123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - surveykiwi

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: surveykiwi_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - surveykiwi

volumes:
  mysql_data:

networks:
  surveykiwi: